<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solver | 8-Puzzle IDDLS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">8-Puzzle AI</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="puzzle.html">Solver</a></li>
          <li class="nav-item"><a class="nav-link" href="comparison.html">Comparison</a></li>
          <li class="nav-item"><a class="nav-link" href="algorithms.html">Algorithm Info</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h2 class="mb-3">Puzzle Input</h2>
    <p class="text-muted">Enter digits 1–8 and use <b>0</b> (or <b>_</b>) for the blank. Each digit must appear once.</p>

    <div class="row g-4 text-center">
      <div class="col-md-6">
        <h5>Initial State</h5>
        <div class="board" id="initialBoard"></div>
      </div>
      <div class="col-md-6">
        <h5>Goal State</h5>
        <div class="board" id="goalBoard"></div>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 justify-content-center my-4">
      <button class="btn btn-outline-primary" id="btnDefault">Load Example</button>
      <button class="btn btn-success" id="btnRandom">Generate Random Puzzle</button>
      <button class="btn btn-primary" id="btnValidate">Validate Puzzle</button>
      <button class="btn btn-warning" id="btnRun">Run IDDLS (Day 1 test)</button>
    </div>

    <div id="message"></div>
    <div id="result" class="mt-3"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/puzzle.js"></script>
  <script src="js/iddls.js"></script>
  <script src="js/puzzle-page.js"></script>
</body>
</html>
